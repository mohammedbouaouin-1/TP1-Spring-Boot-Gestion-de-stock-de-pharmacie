<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Modifier le Produit' : 'Nouveau Produit'}">Formulaire Produit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #047857;
            --primary-hover: #065f46;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 30px 20px 60px 20px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .col-2 {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }

        .form-control {
            padding: 9px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--white);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .tags-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 4px;
        }

        .tag-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--white);
            border-color: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body>

<main class="container">

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${isEdit ? 'Modifier le Produit' : 'Nouveau Produit'}">Nouveau Produit</h1>
            <p style="color: var(--text-secondary); font-size: 0.85rem;">Saisie des informations du produit et de ses associations.</p>
        </div>
        <a th:href="@{/produits}" class="btn btn-secondary">Retour a la liste</a>
    </div>

    <form th:action="@{/produits/save}" th:object="${produit}" method="post">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{detailProduit.id}">

        <div class="card">
            <div class="card-header">Informations generales</div>
            <div class="form-grid">
                <div class="form-group col-2">
                    <label for="nom">Nom du produit *</label>
                    <input type="text" id="nom" th:field="*{nom}" class="form-control" required placeholder="Ex: Paracetamol 500mg">
                </div>

                <div class="form-group col-2">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="2" placeholder="Description du produit"></textarea>
                </div>

                <div class="form-group">
                    <label for="prix">Prix (DH) *</label>
                    <input type="number" step="0.01" id="prix" th:field="*{prix}" class="form-control" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="codeBarre">Code barre</label>
                    <input type="text" id="codeBarre" th:field="*{codeBarre}" class="form-control" placeholder="Ex: DLP500-2025">
                </div>

                <div class="form-group">
                    <label for="dateExpiration">Date d'expiration *</label>
                    <input type="date" id="dateExpiration" th:field="*{dateExpiration}" class="form-control" required>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Associations (Categorie, Fournisseur, Tags)</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="categorie">Categorie</label>
                    <select id="categorie" th:field="*{categorie.id}" class="form-control">
                        <option value="">Selectionner une categorie</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.nom}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fournisseur">Fournisseur</label>
                    <select id="fournisseur" th:field="*{fournisseur.id}" class="form-control">
                        <option value="">Selectionner un fournisseur</option>
                        <option th:each="f : ${fournisseurs}" th:value="${f.id}" th:text="${f.nom}"></option>
                    </select>
                </div>

                <div class="form-group col-2">
                    <label>Tags associes</label>
                    <div class="tags-group">
                        <label th:each="t : ${allTags}" class="tag-item">
                            <input type="checkbox" name="tagIds" th:value="${t.id}"
                                   th:checked="${produit.tags != null and #lists.contains(produit.tags.![id], t.id)}">
                            <span th:text="${t.libelle}">Tag</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Detail du produit</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="fabricant">Fabricant</label>
                    <input type="text" id="fabricant" th:field="*{detailProduit.fabricant}" class="form-control" placeholder="Fabricant">
                </div>

                <div class="form-group">
                    <label for="paysOrigine">Pays d'origine</label>
                    <input type="text" id="paysOrigine" th:field="*{detailProduit.paysOrigine}" class="form-control" placeholder="Pays">
                </div>

                <div class="form-group">
                    <label for="dosage">Dosage</label>
                    <input type="text" id="dosage" th:field="*{detailProduit.dosage}" class="form-control" placeholder="Ex: 500 mg">
                </div>

                <div class="form-group">
                    <label for="composition">Composition</label>
                    <input type="text" id="composition" th:field="*{detailProduit.composition}" class="form-control" placeholder="Substance active">
                </div>

                <div class="form-group col-2">
                    <label for="indications">Indications</label>
                    <textarea id="indications" th:field="*{detailProduit.indications}" class="form-control" rows="2" placeholder="Indications therapeutiques"></textarea>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <a th:href="@{/produits}" class="btn btn-secondary">Annuler</a>
            <button type="submit" class="btn btn-primary" th:text="${isEdit ? 'Enregistrer les modifications' : 'Ajouter le produit'}">
                Enregistrer
            </button>
        </div>
    </form>

</main>

</body>
</html>
